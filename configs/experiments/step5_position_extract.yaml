# STEP 5-2b VLM 응답과 Hidden State 추출 (5-2와 같은 모델·정밀도·해상도·프롬프트 템플릿·저장값, GPU 필요)
# 실행: python -m experiments.step5_position.extract  (실행 환경을 run.json에 기록)
model_config: configs/models/qwen2_5_vl_3b.yaml

cases_jsonl:
  - data/step5_position/step5b_position_cases.jsonl

output_dir: results/step5/qwen2_5_vl_3b/position/extraction
layers: [9, 18, 27, 36]
expected_hidden_size: 2048
pooling_dtype: float32
expected_images: null      # 3~5장
answer_variants: true      # 표기 변형 logsumexp margin (5-2와 같음)
fp32_margin: true          # 주 margin: fp32 변형 margin (5-2와 같음)
verification:
  atol: 0.00001
  rtol: 0.00001
