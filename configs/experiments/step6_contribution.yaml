# STEP 6-2: 이미지별 attention 기여 개입 (Full N / Parallel / Orthogonal / Random / Mean Difference) — 사전 등록 v1
# 설계: docs/plans/step6_attention_contribution.md (6-1 초안 §1~12, 6-2 결정 §13). 사용자 결정 2026-11-14 (STEP 6 진행 지시).
# 계획 파일: python -m experiments.step6_contribution.plan → data/step6_contribution (STEP 6-2 GPU 출력 전에 만들고 해시 고정)
# 이 실험은 기존 데이터를 다시 쓰는 사전 등록 후속 실험이다. 확증 절반은 5-3B 판정에 이미 쓰였다 (preregistration.reuse).
status: confirmatory
model_name: Qwen/Qwen2.5-VL-3B-Instruct
model_config: configs/models/qwen2_5_vl_3b.yaml
split_config: configs/data/step5_causal_split.yaml
plan_dir: data/step6_contribution
pool_cases:
  - data/balanced3/inference_cases/inference_groups_top20_seed42_A_cases.jsonl
  - data/balanced3/inference_cases/inference_groups_top20_seed42_B_cases.jsonl
validation_output: results/step6/qwen2_5_vl_3b/contribution_validation/real_3b.json   # STEP 6-1 validate_real.py 출력
dirs:
  basis: results/step6/qwen2_5_vl_3b/contribution/basis
  pilot: results/step6/qwen2_5_vl_3b/contribution/pilot
  main: results/step6/qwen2_5_vl_3b/contribution/main
  evaluation: results/step6/qwen2_5_vl_3b/contribution/evaluation
frozen_dir: results/step6/qwen2_5_vl_3b/contribution/frozen/v1
comparison_5_3b:                     # 부가 분석: 같은 입력의 5-3B 강화 결과와 나란히 (로컬 평가에서만 읽음)
  main_dir: results/step5/qwen2_5_vl_3b/attention/main
  files: [run.json, conditions.jsonl, main_check.json]
  band: [21, 24]

verification:                        # STEP 5-3과 같은 답·margin 기준 + 6-2 추가 기준
  answer_agreement_min: 0.99         # 비교 기준 쪽 |bf16 margin| > 0.125인 쌍에서
  near_tie_bf16_margin: 0.125
  margin_abs_tolerance: 0.25
  margin_within_share_min: 0.99
  extraction_valid_share_min: 0.99   # 재구성 검사(L21–24 모두 통과) 유효 입력 비율 (basis·main). 연습 실행은 전부
  vector_identity_tolerance: 1.0e-5  # Parallel + Orthogonal = c_N, Random·크기 맞춤 노름 = ‖c_N‖ (상대 오차)
  reconstruction_tolerances: >-
    experiments/step6_contribution/validation.py TOLERANCES, fixed in STEP 6-1 before any real-model run: identity
    rtol = atol = 1e-5; bf16 model attention and output rtol = atol = 2^-6; fp32 model rtol 1e-4, atol 1e-5
stop_conditions:                     # 사용자 지정 2026-11-14: 이 경우에만 멈추고 보고
  rules:
    - "the real 3B validation (reconstruction or intervention locality, fp32 or bf16) fails"
    - "any integrity criterion fails (basis, pilot or main)"
    - "the estimated main-run time from measured pilot times exceeds the limit"
  max_estimated_hours: 8
  estimate_file: results/step6/qwen2_5_vl_3b/contribution/time_estimate.json

design:                              # 실행 쪽 상수 (experiments/step6_contribution/conditions.py). freeze 때 같은지 확인
  layers_one_based: [21, 24]
  layers_zero_based: [20, 21, 22, 23]
  lambda: 3.0
  random_draws: 5
  bases:
    v90: [variance, 0.9]
    v95: [variance, 0.95]
    r64: [rank, 64]
  primary_basis: v90
  allp_primary_slot: 0
  rows:                              # [condition, basis, size, draw, lambda], 0번 행 = 같은 batch 무개입
    - [none, null, raw, null, 0.0]
    - [full, null, raw, null, 3.0]
    - [parallel, v90, raw, null, 3.0]
    - [orthogonal, v90, raw, null, 3.0]
    - [random, null, raw, 0, 3.0]
    - [random, null, raw, 1, 3.0]
    - [random, null, raw, 2, 3.0]
    - [random, null, raw, 3, 3.0]
    - [random, null, raw, 4, 3.0]
    - [mean_difference, null, raw, null, 3.0]
    - [mean_difference, null, match, null, 3.0]
    - [parallel, v90, match, null, 3.0]
    - [orthogonal, v90, match, null, 3.0]
    - [parallel, v95, raw, null, 3.0]
    - [orthogonal, v95, raw, null, 3.0]
    - [parallel, r64, raw, null, 3.0]
    - [orthogonal, r64, raw, null, 3.0]
  pilot_extra_rows:
    - [full, null, raw, null, 0.0]

pilot:
  items: "selection half only: the first boost (False-Yes) one-N item by item_id per image count x N position (9) and the first All-P item per image count (3, every slot as pseudo-N)"
  extra_rows: "one zero-size (lambda 0) Full N row per batch"
  reference: "every pilot row recomputed on the reference path (model.generate full prefill with the same vector added by contribution.OutputAddition at the question tokens)"
  policy: "integrity and timing only; pilot outputs are not part of any analysis and choose no setting"

preregistration:
  decided_before_step6_2_data: true
  decided_by: >-
    user, 2026-11-14 (STEP 6 instruction): data sources for the P basis and the mean difference, no centering, 90%
    explained energy (95% and a fixed rank as sensitivity), random directions averaged over draws seeded by the input
    ID, mean difference at raw and matched size, primary population, hypotheses H1 / H2 with minimum effect 0.25, the
    decision structure of STEP 5-3B, side-effect rule, stop conditions. The fixed rank (64) and the number of random
    draws (5) were set by the implementation before any STEP 6-2 GPU output.
  reuse: >-
    This is a preregistered follow-up experiment that reuses existing data. The confirmation-half inputs (STEP 5-2b
    images and baseline outputs, STEP 5-3 split by N image, seed 53) were already used for the STEP 5-3B decision
    (B-H2: boosting attention to N in band 21-24 lowered the margin of False-Yes inputs, robust support), and the band
    L21-24 itself was selected in STEP 5-3B on the selection half. The result is therefore not an independent
    confirmation. Independent confirmation requires new images or another model.
  scope: >-
    Tests whether amplifying the N image's own attention-output contribution at the question tokens of layers 21-24
    lowers the Yes - No margin of False-Yes inputs more than a random direction of the same size (H1), and whether the
    part of that contribution orthogonal to the subspace spanned by P-image contributions lowers it more than the part
    inside that subspace (H2). The N location is taken from the ground truth (oracle); this is a mechanism test, not a
    deployable correction.
  data:
    split: "STEP 5-3 halves by N image ID, seed 53 (configs/data/step5_causal_split.yaml, data/step5_causal)"
    primary_population: "confirmation-half one-N inputs answered Yes in the 5-2b main run (False-Yes; the STEP 5-3B boost population): 2,501 items, 3-5 images, every N position"
    side_effect_population: "confirmation-half STEP 5-2 All-P inputs with 3-5 images answered Yes in the 5-2 main run: 1,985 items (7,931 item x slot batches)"
    selection_half: "used only for the pilot (integrity and timing); never for choosing a setting"
    basis_pool: >-
      STEP 3 exploration pool: the 2,332 unique STEP 1-3 inputs (3 images; 20 classes; 8 P and 8 N images per class;
      310 images) in data/balanced3/inference_cases (A and B modes; compositions PPP, PPN, PNP, NPP, PNN, NNN). Overlap
      with the 5-2, 5-2b and 5-3 input images is 0 by COCO id and by file SHA-256 (data/step6_contribution/plan_check.json).
  contribution: >-
    c_i[l, t] = W_O concat_h sum_{j in image i's image-pad tokens} A[h, t, j] v[h, j] in the o_proj output space (the
    model's o_proj has no bias), for layers l = 21-24 (0-based 20-23) and question tokens t (after the last image's
    vision_end through the last input token; 26-28 tokens; the STEP 5-3B post-image query). A and v are recomputed from
    a no-intervention forward (full prefill, batch 1, no cache) with the model's projections, mrope, mask and scaling;
    softmax and weighted sums in float32 (experiments/step6_contribution/contribution.py, validated in STEP 6-1).
  intervention:
    site: "output of the attention module (after o_proj, before the residual add) of layers 21-24, at every question token; generated tokens are not modified directly"
    formula: "o'[l, t] = o[l, t] + lambda * v[l, t], added in float32 and cast back to the model dtype (bf16)"
    lambda: 3
    strength_note: "With v = c_N the N image's contribution becomes 4 times its size, without renormalizing attention; this is not the STEP 5-3B boost (+log 4 on attention logits, renormalized)."
    vector_source: "c_N from a separate no-intervention forward of the same input; the same stored vector is added in every layer whatever the earlier-layer additions do"
    computation: >-
      STEP 5-3B fast path (src/core/causal_runtime.Runner): the prefix through the last image's vision_end is computed
      once with a KV cache; the question tokens are recomputed for all conditions of an (item, slot) in one batch with
      the no-intervention row in the same batch; greedy generation (max 8 new tokens, the model's repetition penalty
      1.05) continues from the intervened state.
  conditions:
    full: "v = c_N"
    parallel: "v = U U^T c_N (U: the layer's P-subspace basis; v90 primary)"
    orthogonal: "v = (I - U U^T) c_N, so parallel + orthogonal = full"
    random: >-
      v[l, t] = ||c_N[l, t]|| g / ||g||, g ~ N(0, I_2048) independently per layer and token; 5 draws per (item, slot);
      generator seed = the first 60 bits of SHA-256('step6|<item_id>|slot<s>|draw<r>'); Delta m(Random) and the Random
      answer change are the means over the 5 draws of the same input
    mean_difference: "raw: v = mu_N - mu_P at every question token; size-matched: v[l, t] = (mu_N - mu_P) / ||mu_N - mu_P|| * ||c_N[l, t]||"
    size_matched_parallel_orthogonal: "parallel and orthogonal rescaled per token to ||c_N[l, t]|| (secondary); a token whose component is below 1e-12 of ||c_N|| gets a zero vector and is counted"
    primary_comparison_size: "original sizes (parallel + orthogonal = full is preserved); size-matched comparisons are secondary"
  p_subspace:
    source: "every P-slot contribution of every STEP 3 pool input whose reconstruction check passes (3,894 P slots x question tokens), per layer"
    centering: "none: decomposition of the second moment about the origin (explained share = energy share)"
    method: "eigendecomposition (float64) of M = sum c c^T accumulated over all vectors; equal to the right singular vectors of the stacked vectors; U = the top-k eigenvectors"
    dimension_primary: "v90: the smallest k whose cumulative energy share is >= 0.90"
    dimension_sensitivity: ["v95: the same with 0.95", "r64: fixed rank 64"]
    fitted_once: "on the GPU server before the pilot; basis.pt is hashed in basis_check.json and the pilot and main run must load the same file"
  mean_difference:
    source: "STEP 3 pool inputs containing both P and N images (1,539 inputs: P+P+N, P+N+P, N+P+P, P+N+N) whose reconstruction check passes"
    mu_N: "mean N-slot contribution over N slots and question tokens (1,923 N slots, 157 N images)"
    mu_P: "mean P-slot contribution over P slots and question tokens of the same inputs (2,694 P slots)"
    sufficiency: >-
      At least 5 N images in each of the 20 classes and at least 1,000 N slots, 1,000 P slots in mixed inputs and
      1,000 P slots for the basis (met before the run: 8 N images per class, 1,923 / 2,694 / 3,894 slots). Checked
      again after reconstruction exclusions in the basis check. If not met, the mean-difference condition is reported
      as "not prepared" and never replaced by evaluation data.
  outcomes:
    margin: "fp32 variant margin (as STEP 5-2 / 5-3)"
    delta: "Delta m(condition) = intervened margin - no-intervention margin of the same batch"
    answer_parsing: "as STEP 5-2"
  exclusion: >-
    An item is excluded from every analysis, with counts by reason, if (1) its extraction record is missing, (2) its
    reconstruction check fails at any of the four layers, or (3) the no-intervention row of its batch answers
    differently from the baseline answer (as STEP 5-3 frozen v2).
  hypotheses:
    H1:
      name: "the N image's own contribution corrects False-Yes beyond a random change of the same size"
      contrast: "D1 = Delta m(Full N) - Delta m(Random)"
      n_arm: "Delta m(Full N)"
      reported_arm: "Delta m(Random)"
      direction: negative
      minimum_effect: -0.25
    H2:
      name: "the correction is carried by the part of the N contribution outside the P-contribution subspace"
      contrast: "D2 = Delta m(Orthogonal) - Delta m(Parallel), basis v90, original sizes"
      n_arm: "Delta m(Orthogonal)"
      reported_arm: "Delta m(Parallel)"
      direction: negative
      minimum_effect: -0.25
    weighting: "each item equal weight; image counts and N positions pooled"
    note: "H1 and H2 are decided separately; neither changes any STEP 5 decision."
  minimum_effect:
    confirmed: true
    confirmed_by: "user, 2026-11-14 (0.25); reviewed by the implementation and kept"
    margin_logit: 0.25
    rationale: >-
      Two bf16 margin steps (0.125) and half of the STEP 5-3 minimum (0.5), because both arms of each contrast are
      interventions of the same size rather than an intervention against none. Rows of one batch with identical
      vectors are bit-identical (STEP 5-3B zero-size rows: exact share 1.0), so the contrasts carry no computation-path
      noise. The STEP 5-3B boost contrast at L21-24 had a 97.5% N-image CI half-width of about 0.06 on the same
      confirmation-half inputs, so a 0.25 difference is resolvable.
  decision:
    level: "97.5% intervals (Bonferroni for the two primary hypotheses), N-image cluster bootstrap"
    joint_condition_note: "Support requires both the contrast condition and the N-arm condition (intersection-union, as STEP 5-3B); no further multiplicity adjustment."
    supported: >-
      (1) mean contrast <= -0.25 AND N-image cluster 97.5% CI upper bound of the contrast < 0; AND (2) mean N arm < 0
      AND N-image cluster 97.5% CI upper bound of the N arm < 0
    robust_label: "'robust support' only if the class-cluster 97.5% CI upper bounds of both the contrast and the N arm are < 0; otherwise 'support (cross-class generalization uncertain)'"
    no_meaningful_difference: "N-image cluster 97.5% CI lower bound of the contrast > -0.25"
    otherwise: "inconclusive; the unmet condition is stated (contrast, N arm, or both)"
    reported_arm: "always reported with its sign, estimate and 97.5% N-image cluster CI (no decision)"
  statistics:
    method: "percentile cluster bootstrap; 97.5% for H1 / H2 and the reported arms, 95% for secondary results (labelled)"
    resampling_unit: "N image ID (STEP 5-3 anchor) within the confirmation half; all items of a drawn N image enter together"
    sensitivity: "class cluster bootstrap (robust label)"
    reps: 1000
    seed: 42
  secondary:
    answer_change: "share of False-Yes items whose answer becomes No, per condition (Random: mean over draws), and the paired differences full - random and orthogonal - parallel"
    mean_difference: "Delta m and answer change for the raw and size-matched mean-difference directions; contrasts with Random and with Full N"
    size_matched: "D2 with parallel and orthogonal rescaled to ||c_N|| (secondary to the original-size H2)"
    basis_sensitivity: "D2 with v95 and with r64"
    breakdown: "by image count (3, 4, 5) and N position (first / middle / last): Delta m for Full, Random, Parallel, Orthogonal; D1; D2; Full answer change"
    step5_3b_side_by_side: "items valid in both runs: STEP 5-3B boost on N (band 21-24, post-image query) vs STEP 6 Full N; Delta m and answer change with paired differences (the two operations differ)"
    orthogonal_residual: "per layer and basis: ||(I - U U^T) c_N|| / ||c_N|| and the parallel energy share (token means per item), with ||c_N||, ||c_N|| / ||o||, the N attention share and cos(c_N, mu_N - mu_P) (descriptive)"
    sensitivity: "D1 and D2 including items whose no-intervention answer changed; with the bf16 margin; without items whose baseline bf16 margin sign disagrees with the baseline answer"
  all_positive_side_effect: >-
    Every condition applied to confirmation-half All-P items answering Yes without intervention, with the first P image
    (slot 0) as pseudo-N (primary rule) and with every slot in turn (sensitivity: per slot, and the per-item mean over
    slots): share whose answer becomes No (95% CI) and Delta margin. A slot-0 share above 0.05 for any condition is
    flagged as a warning. This simulates choosing a P image as N by mistake. STEP 5-3B used slot 0 or the last slot by
    5-2 placement, so its All-P values are not directly comparable.
  interpretation:
    - "Oracle N location: the result shows what the N contribution can do, not a usable correction method."
    - "The vectors are added at L21-24 and change later layers through the residual stream; the effect includes all downstream consequences."
    - "Adding contribution does not renormalize attention and is a different operation from the STEP 5-3B softmax boost."
    - "The P subspace and the mean difference come from 3-image STEP 3 inputs (prompt 'all 3 images'); the evaluation inputs have 3-5 images."
    - "Parallel and Orthogonal differ in size in the primary comparison; direction alone is compared only in the size-matched secondary analysis."
    - "Images and baseline outputs are reused and the confirmation half already entered the STEP 5-3B decision; this is not an independent test."
  integrity_checks:
    - "real 3B validation before any other GPU stage: reconstruction (identity, attention, output) and intervention locality on 3 fixed selection-half inputs, fp32 and bf16 (else stop)"
    - "basis: every pool input extracted, reconstruction-valid share >= 0.99, accumulated counts equal the valid inputs, mean-difference sufficiency, orthonormal finite bases, basis.pt hash (else stop)"
    - "pilot: every row recomputed on the reference path with the same thresholds as STEP 5-3; zero-size rows equal the no-intervention row; every pilot input reconstruction-valid; vector identities (else stop)"
    - "main: every planned batch written with the planned rows; no-intervention rows reproduce the baseline answers and margins (STEP 5-3 thresholds); reconstruction-valid share >= 0.99; vector identities; same basis and frozen version (else stop)"
    - "image token spans and the post-image boundary identical to the baseline runs (checked for every input before running)"
    - "run.json records GPU type, driver, CUDA and library versions and the model config hashes"
  reported_not_decided:
    - "answer agreement over all compared pairs, near-ties included"
    - "numbers of excluded items by reason"
    - "number of size-matched tokens set to zero"

