# STEP 5-2b 위치 격자 실험: 사전 등록 (freeze 시 해시와 함께 고정, 이후 변경 금지)
# 최소 의미 효과 사용자 확정(2026-11-13). 파일럿·본 추출(GPU)은 freeze 이후.
cases: data/step5_position/step5b_position_cases.jsonl
consistency_check: data/step5_position/step5b_position_consistency_check.json
case_config: configs/data/step5_position.yaml
extract_config: configs/experiments/step5_position_extract.yaml
run_dir: results/step5/qwen2_5_vl_3b/position/extraction
pilot_dir: results/step5/qwen2_5_vl_3b/position/pilot
pilot_limit: 48                                   # 파일 앞 48개 = 4계열 × 12 (3~5장 모든 위치 포함)
output_dir: results/step5/qwen2_5_vl_3b/position
frozen_dir: results/step5/qwen2_5_vl_3b/position/frozen/v1
zi_frozen_dir: results/step4/qwen2_5_vl_3b/frozen/v1          # z_i·h_q는 STEP 4 고정 Probe로만 계산 (재학습 금지)
accumulation:                                                  # 재사용·비교용 5-2 기록 (수정하지 않음)
  frozen_dir: results/step5/qwen2_5_vl_3b/accumulation/frozen/v2
  run_dir: results/step5/qwen2_5_vl_3b/accumulation/extraction
  evaluation: results/step5/qwen2_5_vl_3b/accumulation/evaluation/analysis.json
code_files:                                       # freeze 시 해시 기록
  - src/data_manipulate/build_position.py
  - src/data_manipulate/check_position.py
  - experiments/step5_position/extract.py
  - src/common/environment.py
  - src/core/position_check.py
  - src/core/position_freeze.py
  - experiments/step5_position/check_pilot.py
  - src/core/accumulation_check.py
  - src/core/accumulation_freeze.py
  - experiments/step2_hidden_states/run.py
  - src/core/features.py
  - src/core/inference.py
  - src/core/prompts.py
  - src/core/model.py
  - src/core/feature_validation.py
status: confirmatory
verification:
  atol: 0.00001
  rtol: 0.00001
integrity:
  prefix_max_cosine_distance: 0.001               # 5-2 N-first 동일성 기준과 같은 값

preregistration:
  decided_before_step5_2b_data: true
  scope: >-
    Directly tested: sensitivity of the final answer to the order of the same images. Causes (image representation,
    attention, aggregation, final decision stage) are separated later by patching and intervention experiments.
    Position effects on new images are part of the 5-5 final-test preregistration, not a separate experiment.
  observed_before:
    note: >-
      STEP 5-2 (preregistration v2, evaluated 2026-11-13) already observed the first-position (N-first) and
      last-position (N-last) False-Yes rates for 3-5 images on these same series (post-hoc same-image order gap,
      first minus last: +0.125, +0.090, +0.092 for 3, 4, 5 images). The confirmatory targets here are the new
      middle-position conditions. First and last positions are re-extracted in the 5-2b run and every
      confirmatory contrast uses values from that single run; STEP 5-2 values are used only for the cross-run report.
    step4_three_image_rates: {NPP: 0.279, PNP: 0.356, PPN: 0.186}   # STEP 4, different P images, same image pool
  design:
    source: "STEP 5-2 series: 480 N images x High/Low strength, P order P1..P5 (no new images)"
    grid: >-
      For P count k = 2, 3, 4 (3-5 images) and a = 0..k: P1..Pk in series order with N inserted after a P images
      (b = k - a P images after N). a = 0 is the first position, a = k the last, a = 1..k-1 the middle positions.
    records: "11,520 = 960 series x (3 + 4 + 5); 5,760 middle (new) + 5,760 first/last (re-extracted)"
    representation_note: >-
      Image tokens precede the question text, so the N image's representation z_N depends only on the images before
      it: inputs with the same a share z_N regardless of b (within bf16 numerical error).
  hypotheses:
    H1b: "N-last advantage: mean False-Yes over middle positions minus False-Yes at the last position > 0"
    H2b: "Middle-position effect: mean False-Yes over middle positions minus False-Yes at the first position > 0"
    note: "H1b and H2b are decided separately; neither changes the STEP 5-2 hypotheses or decisions."
  unit: "series (one N image x one strength); contrasts are paired within a series"
  definitions:
    middle_mean: "3 images: position 2; 4 images: mean of positions 2-3; 5 images: mean of positions 2-4"
    contrast: >-
      Per series and image count (3, 4, 5): middle_mean minus the end position (last for H1b, first for H2b).
      Primary estimate: equal-weight mean over the three image counts, then mean over series (High and Low equal weight).
    answer_parsing: "as STEP 5-2 (greedy, max_new_tokens 8, strip, trailing punctuation removed, case-folded)"
    false_yes: "parsed answer Yes on a one-N input; unparsed answers are not Yes and are counted separately"
    margin_primary: "fp32_variant_logit_margin (as STEP 5-2)"
    margin_sensitivity: "logit_margin (bf16 'Yes' / 'No', as STEP 5-2)"
  primary:
    outcome: "False-Yes rate (generated answer)"
    contrasts: [H1b, H2b]
  minimum_effect:
    confirmed: true
    confirmed_by: "user, 2026-11-13, before any STEP 5-2b model output"
    false_yes_rate: 0.05
    margin: null                                  # 보조 결과: 판정 없이 추정값과 CI만
    rationale: >-
      Same value as STEP 5-2. The same-image first-minus-last gap in 5-2 was +0.09 to +0.125 (post-hoc); a middle
      position that differs from an end by about half of that gap is the practical lower bound. Projected 97.5% CI
      half-width of the pooled contrast from 5-2 variance (proxy: within-series first minus last, equal weight over
      3-5 images; conservative because the middle mean averages 1-3 positions): N-image cluster 0.021, class cluster
      0.045 (per image count 0.028-0.033 and 0.048-0.058). fp32 margin proxy: 0.050 and 0.149.
  decision:
    level: "97.5% intervals (Bonferroni for two primary hypotheses), N-image cluster bootstrap"
    per_hypothesis_supported: "point estimate >= 0.05 AND N-image cluster 97.5% CI lower bound > 0"
    robust_label: >-
      'robust support' only if the class-level cluster bootstrap 97.5% CI lower bound is also > 0; otherwise
      'support (cross-class generalization uncertain)'
    no_meaningful_difference: "N-image cluster 97.5% CI upper bound < 0.05"
    otherwise: "inconclusive"
  statistics:
    method: "percentile cluster bootstrap, 97.5% for H1b/H2b (95% for secondary and exploratory results, labelled)"
    resampling_unit: "N image ID; all series and inputs of a drawn N image enter together"
    sensitivity: "class-level cluster bootstrap (robust label)"
    reps: 1000
    seed: 42
  secondary:
    per_count: "H1b and H2b contrasts for 3, 4 and 5 images separately"
    margin: "the same contrasts with the fp32 variant margin (estimates and CIs only) and the bf16 margin"
    step4_comparison: >-
      3 images: PNP minus NPP (part of H2b) reported next to STEP 4 (NPP 0.279, PNP 0.356, PPN 0.186) as a
      follow-up check on the same image pool, not an independent replication
    cross_run: >-
      5-2 vs 5-2b on the 5,760 identical first/last inputs: parsed-answer agreement, margin differences (both
      definitions) and z_N cosine distance, reported as run-to-run noise together with the recorded GPU, driver and
      library versions
    sign_consistency: "contrasts repeated without inputs whose bf16 margin sign disagrees with the answer (ties included)"
  exploratory:
    H3: >-
      Relation of the False-Yes rate to a (P before N) and b (P after N). With a fixed, z_N is identical across b
      (prefix property), so effects of b arise after the image representation; effects of a are reported together
      with the representation change of z_N. Increasing a changes both the preceding image content and the absolute
      token position of N (rotary position), and this design does not separate the two.
    representation:
      - "z_N by a against a = 0 (same N image, no preceding image): cosine distance per layer with the bf16 baseline (5-2 N-first identity: median 5.6e-5, max 4.0e-4), frozen z_i probe raw logit and p(P)"
      - "within series: z_N probe-logit change vs margin change"
      - "h_q change; position readouts only for 3-image inputs (trained on 3 images), not for 4-5 images"
      - "z_i probe image-level accuracy at positions 4-5 (shift with input length)"
      - "STEP 5-2 N-last z_N by image count in the same format"
  integrity_checks:
    - "token count of each image identical across all inputs that contain it, and identical to STEP 4 / 5-2"
    - "within run: inputs with the same series and a share z_N (cosine distance <= 0.001 at every layer), including the re-extracted N-last input with k = a"
    - "across runs: middle z_N vs the STEP 5-2 N-last (k = a) z_N, and re-extracted first/last vs 5-2, with the same criterion; exceeding marks an environment difference (reported), it does not block evaluation because confirmatory contrasts are within the 5-2b run"
    - "margin sign agreement with the generated answer (both margins)"
    - "run.json records GPU type, driver, CUDA and library versions (experiments.step5_position.extract)"
