statistics:                                                         # 95% 백분위, N 이미지·클래스 군집 (5-2와 같은 반복·seed)
  reps: 1000
  seed: 42
precision_level: 0.975                                              # 5-2b 예상 CI 반폭 (Bonferroni 97.5%)
